<!doctype html><html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perhatikan Taman Ceria</title><style>
:root{--green:#345c32;--lime:#dcefa6;--cream:#fffdf2;--pink:#f8c9c5;--ink:#263c25}*{box-sizing:border-box}body{margin:0;font-family:'Trebuchet MS',Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 5%,#e6f5d2,transparent 35%),linear-gradient(180deg,#fffde9,#edf5d9);padding:18px}.wrap{max-width:1050px;margin:auto}.hero{text-align:center;background:#fffdf5;border:3px solid #a8c878;border-radius:28px;padding:22px 14px;box-shadow:0 6px 0 #d8e8ba}.hero h1{color:var(--green);font-size:clamp(28px,5vw,46px);margin:0 0 6px}.hero p{margin:0;font-size:17px}.top{display:flex;gap:14px;align-items:center;justify-content:space-between;margin:18px 0;flex-wrap:wrap}.instruction{background:#fffdf4;border:2px dashed #a8c878;border-radius:20px;padding:15px 20px;flex:1;min-width:240px}.instruction strong{color:var(--green);font-size:21px}.score{background:#e9f4d4;border:2px solid #a2c475;border-radius:18px;padding:15px 22px;font-weight:bold;font-size:19px}.progress{height:12px;background:#e0e8d1;border-radius:99px;overflow:hidden;margin-bottom:16px}.bar{height:100%;width:0;background:#679c42;transition:width .3s}.questions{display:grid;gap:13px}.question{display:grid;grid-template-columns:38px 145px minmax(180px,1fr) minmax(200px,310px);align-items:center;gap:14px;background:#fffef7;border:2px solid #e0dfb4;border-radius:20px;padding:12px}.num{background:#638e43;color:white;border-radius:50%;height:35px;width:35px;display:grid;place-items:center;font-weight:bold}.scene{width:145px;height:88px;object-fit:cover;border-radius:15px}.sentence{font-size:18px;font-weight:650;line-height:1.4}.options{display:flex;gap:8px}.opt{flex:1;border:2px solid #a8ca73;border-radius:40px;background:#e6f3b9;padding:12px 5px;font-size:16px;font-weight:700;cursor:pointer;color:#24391e}.opt:hover:not(:disabled),.opt:focus-visible{background:#d1e99b;outline:2px solid #597d39;outline-offset:2px}.opt.correct{background:#477e2c;color:#fff;border-color:#477e2c}.opt.wrong{background:#f8c8c3;border-color:#dc827a}.opt:disabled{cursor:default}.feedback{grid-column:3/5;font-size:14px;font-weight:bold;margin-top:-5px}.feedback.good{color:#34722e}.feedback.bad{color:#a34539}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:24px 0}button.main{border:0;border-radius:40px;background:#e58b90;color:#fff;font-size:18px;font-weight:bold;padding:14px 28px;cursor:pointer;box-shadow:0 4px 0 #b66d72}button.main.secondary{background:#628c49;box-shadow:0 4px 0 #416630}.result{display:none;text-align:center;border:3px dashed #94bd69;border-radius:24px;background:#fffdf3;padding:25px;margin:20px 0}.result h2{font-size:30px;color:var(--green);margin:0 0 10px}.foot{text-align:center;color:#59734b;font-size:13px;padding:15px}@media(max-width:760px){.question{grid-template-columns:35px 110px 1fr;gap:9px}.scene{width:110px;height:80px}.sentence{font-size:16px}.options{grid-column:2/4}.feedback{grid-column:2/4}.top{align-items:stretch}.score{text-align:center}}@media(max-width:420px){body{padding:9px}.question{grid-template-columns:32px 92px 1fr;padding:9px}.scene{width:92px;height:73px}.sentence{font-size:14px}.opt{font-size:15px}}
</style><style>
.result{display:none;position:fixed;inset:0;z-index:2000;margin:0;border:0;border-radius:0;background:rgba(29,55,27,.65);padding:16px;align-items:center;justify-content:center}
.result.is-visible{display:flex!important}
.result-panel{width:min(480px,95vw);background:#fffdf2;border:4px solid #a5ca75;border-radius:30px;padding:34px 20px;box-shadow:0 12px 45px #1c371d66}
.result-panel p{font-size:20px;line-height:1.5}
#check:disabled{opacity:.6;cursor:not-allowed}
</style><style>
.sound-toggle{position:fixed;right:16px;top:14px;z-index:999;border:2px solid #719452;border-radius:28px;background:#fffdf2;color:#345c32;padding:10px 16px;font-weight:800;cursor:pointer;box-shadow:0 3px 12px #345c3225}.sound-toggle:focus-visible{outline:3px solid #ef9b9b}
</style></head><body><button id="soundToggle" class="sound-toggle" type="button" aria-pressed="true" onclick="toggleSound()">🔊 Bunyi: ON</button><main class="wrap"><header class="hero"><h1>🌿 Perhatikan Taman Ceria 🐥</h1><p>Kata Adjektif Cara dan Kata Adjektif Jarak</p></header><section class="top"><div class="instruction"><strong>📋 Tugas Kamu</strong><div>Perhatikan gambar dan pilih kata adjektif yang sesuai. Klik jawapan untuk mendapatkan maklum balas!</div></div><div class="score" aria-live="polite">⭐ Skor: <span id="score">0</span> / 6</div></section><div class="progress" aria-label="Kemajuan aktiviti"><div class="bar" id="bar"></div></div><section id="questions" class="questions"></section><section id="result" class="result" role="dialog" aria-modal="true" aria-labelledby="resultTitle" aria-live="polite"><div class="result-panel"><h2 id="resultTitle"></h2><p id="resultText"></p><button class="main secondary" onclick="restart()">↻ Ulangi Aktiviti</button></div></section><div id="status" role="status" style="text-align:center;font-weight:bold;color:#345c32;margin-top:14px">Jawab semua enam soalan dahulu.</div><div class="actions"><button class="main secondary" onclick="restart()">↻ Cuba Semula</button><button class="main" id="check" onclick="finish()" disabled>🏆 Lihat Keputusan</button></div><footer class="foot">Belajar sambil bermain • Tidak mengumpul maklumat peribadi murid</footer></main><script>

let soundOn=true, audioCtx=null;
function toggleSound(){soundOn=!soundOn;const b=document.getElementById('soundToggle');b.textContent=soundOn?'🔊 Bunyi: ON':'🔇 Bunyi: OFF';b.setAttribute('aria-pressed',String(soundOn));if(soundOn)playSound('click')}
function tone(freq,start,duration,volume=.045,type='sine'){
 if(!soundOn)return;
 try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+start;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(volume,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+duration+.02)}catch(e){}
}
function playSound(kind){if(!soundOn)return;
 if(kind==='correct'){tone(660,0,.13);tone(880,.14,.22)}
 else if(kind==='wrong'){tone(320,0,.14,.025);tone(280,.16,.19,.02)}
 else if(kind==='win'){[523,659,784,1047].forEach((f,i)=>tone(f,i*.13,.24,.045))}
 else{tone(520,0,.07,.025,'triangle')}
}

const questions=[
 {q:'Mia berlari dengan ______ di taman.',opts:['pantas','perlahan'],a:0,why:'Pantas bermaksud bergerak dengan cepat.'},
 {q:'Ahmad berjalan dengan ______ di laluan taman.',opts:['perlahan','gopoh'],a:0,why:'Perlahan bermaksud bergerak dengan lambat.'},
 {q:'Siti menanam bunga dengan ______.',opts:['cermat','gopoh'],a:0,why:'Cermat bermaksud melakukan sesuatu dengan teliti.'},
 {q:'Ali menyiram pokok dengan ______ sehingga air tertumpah.',opts:['cermat','gopoh'],a:1,why:'Gopoh bermaksud melakukan sesuatu dengan terburu-buru.'},
 {q:'Gazebo itu berada ______ dari bangku.',opts:['dekat','jauh'],a:1,why:'Jauh menunjukkan jarak yang besar.'},
 {q:'Bunga raya itu berada ______ di sebelah papan tanda.',opts:['dekat','hampir'],a:0,why:'Dekat menunjukkan jarak yang tidak jauh.'}
];
let answers=Array(questions.length).fill(null);
function render(){
 document.getElementById('questions').innerHTML=questions.map((q,i)=>{
  const chosen=answers[i];
  return `<article class="question"><span class="num">${i+1}</span><img class="scene" src="${images[i]}" alt="Gambar situasi soalan ${i+1}"><div class="sentence">${q.q}</div><div class="options">${q.opts.map((o,j)=>`<button type="button" class="opt ${chosen===j?(j===q.a?'correct':'wrong'):''}" onclick="answer(${i},${j})" ${chosen!==null?'disabled':''} aria-label="Soalan ${i+1}: ${o}">${o}</button>`).join('')}</div>${chosen!==null?`<div class="feedback ${chosen===q.a?'good':'bad'}">${chosen===q.a?'✓ Betul!':'✗ Belum tepat. Jawapan: '+q.opts[q.a]+'.'} ${q.why}</div>`:''}</article>`;
 }).join('');
 const done=answers.filter(a=>a!==null).length;
 const score=answers.filter((a,i)=>a===questions[i].a).length;
 document.getElementById('score').textContent=score;
 document.getElementById('bar').style.width=(done/questions.length*100)+'%';
 document.getElementById('check').disabled=done!==questions.length;
 document.getElementById('status').textContent=done===questions.length?'Semua soalan selesai! Klik Lihat Keputusan.':`Soalan dijawab: ${done}/${questions.length}`;
}
function answer(i,j){
 if(answers[i]!==null)return;
 answers[i]=j;
 playSound(j===questions[i].a?'correct':'wrong');
 render();
}
function finish(){
 const done=answers.filter(a=>a!==null).length;
 if(done!==questions.length)return;
 const score=answers.filter((a,i)=>a===questions[i].a).length;
 document.getElementById('resultTitle').textContent=score===6?'🎉 Tahniah!':'🌟 Syabas kerana mencuba!';
 document.getElementById('resultText').textContent=`Skor kamu: ${score}/${questions.length}. ${score===6?'Semua jawapan betul!':'Baca maklum balas dan cuba sekali lagi untuk meningkatkan penguasaan.'}`;
 const result=document.getElementById('result');
 result.classList.add('is-visible');
 playSound('win');
 result.querySelector('button').focus();
}
function restart(){
 playSound('click');
 answers=Array(questions.length).fill(null);
 document.getElementById('result').classList.remove('is-visible');
 render();
 window.scrollTo({top:0,behavior:'smooth'});
}
render();
</script></body></html>
